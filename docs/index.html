<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vokabeltrainer Englisch B1 – Simulation</title>
<meta name="description" content="Interaktive Simulation des Vokabeltrainers Englisch B1 (Deutsch/English) – Oberfläche, Excel-Import, Export, MP3, Installation und Lizenzen.">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16212b; --muted:#566574; --line:#d9e0e7;
  --accent:#0b7a75; --accent-ink:#ffffff; --sel:#e0f1ef; --warn:#8a4300; --warnbg:#fff1e0;
  --ok:#17803d; --okbg:#e3f5e8; --bad:#b3261e; --badbg:#fde8e6; --title:#dfe5ea; --shadow:rgba(20,35,50,.16);
  --font:"Segoe UI","Atkinson Hyperlegible",system-ui,-apple-system,Roboto,sans-serif; --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171c; --surface:#1a2229; --ink:#e7edf2; --muted:#98a7b4; --line:#2a353e;
  --accent:#41c3ba; --accent-ink:#04201e; --sel:#18363a; --warn:#ffb36b; --warnbg:#3a2813;
  --ok:#6fd48f; --okbg:#15301f; --bad:#ff8a80; --badbg:#3b1b19; --title:#222d35; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a2229; --ink:#e7edf2; --muted:#98a7b4; --line:#2a353e;
  --accent:#41c3ba; --accent-ink:#04201e; --sel:#18363a; --warn:#ffb36b; --warnbg:#3a2813;
  --ok:#6fd48f; --okbg:#15301f; --bad:#ff8a80; --badbg:#3b1b19; --title:#222d35; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px}
/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px}
.nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--sel)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px}
/* ---------- Abschnitte ---------- */
section{padding-block:44px;scroll-margin-top:60px}
section+section{border-top:1px solid var(--line)}
h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:clamp(22px,3.2vw,30px);margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:18px;margin:0 0 6px}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);max-width:68ch;margin:0 0 20px}
.sub{color:var(--muted);margin:0 0 22px;max-width:75ch}
.hero{padding-block:48px 36px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.badge b{color:var(--accent)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card .ic{font-size:24px;margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:15px}
.note{border-left:4px solid var(--warn);background:var(--warnbg);padding:12px 16px;border-radius:0 10px 10px 0;margin:18px 0;font-size:15px}
.note.ok{border-color:var(--ok);background:var(--okbg)}
/* ---------- Demo-Leiste ---------- */
.demos{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.demos .lbl{font-weight:700;font-size:14px;color:var(--muted);margin-right:4px}
/* ---------- Fenster ---------- */
.win{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 14px 40px var(--shadow)}
.tb{background:var(--title);display:flex;align-items:center;justify-content:space-between;padding:7px 12px;font-size:13px;color:var(--muted)}
.tb span:first-child{display:flex;gap:8px;align-items:center}
.tb i{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--accent)}
.ctl{letter-spacing:10px;font-size:12px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:640px;font-size:var(--fs)}
.side{background:var(--bg);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:3px}
.side button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:calc(var(--fs) - 2px)}
.side button:hover{background:var(--sel)}
.side button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.side .sp{flex:1}
.user{border-top:1px solid var(--line);padding:10px 8px 2px;font-size:13px;color:var(--muted);line-height:1.35}
.user select{width:100%;margin-top:4px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.main{display:flex;flex-direction:column;min-width:0}
.page{padding:20px 24px;flex:1;min-width:0}
.page h2.pt{font-size:calc(var(--fs) + 9px);margin:0 0 4px}
.muted{color:var(--muted)}
.status{border-top:1px solid var(--line);background:var(--bg);padding:6px 14px;font-size:13px;color:var(--muted);min-height:30px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
select.fld{min-width:220px}
.chip{display:inline-block;background:var(--sel);color:var(--accent);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:calc(var(--fs) - 2px)}
.b:hover{border-color:var(--accent)}
.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.b.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.b.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.b[disabled]{opacity:.5;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sent{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.sent.on{border-color:var(--accent);background:var(--sel)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:15px}
.sent .en{font-weight:700}
.sent .pr{color:var(--muted);font-size:.85em}
.sent .de{color:var(--muted)}
.sent .ex{font-size:.88em;color:var(--muted);margin-top:3px;font-style:italic}
.player{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.player label{font-size:13px;color:var(--muted);display:block}
table.tab{border-collapse:collapse;width:100%;margin-top:14px;font-size:calc(var(--fs) - 2px)}
.tab th,.tab td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.tab th{font-size:13px;color:var(--muted);text-transform:none}
.tab tr.hl td{background:var(--sel)}
.tab tbody tr{cursor:default}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.qcard{margin:18px auto 0;max-width:620px;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;background:var(--surface);box-shadow:0 4px 18px var(--shadow)}
.qcard .dir{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qcard .q{font-size:calc(var(--fs) + 7px);font-weight:700;margin:10px 0 14px;word-break:break-word}
.qcard .a{font-size:calc(var(--fs) + 3px);color:var(--accent);min-height:1.6em;margin-bottom:12px;font-weight:700}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.fb{padding:8px 12px;border-radius:8px;margin-top:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--bg)}
.log{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.55 ui-monospace,Consolas,monospace;max-height:170px;overflow:auto;white-space:pre-wrap}
.files{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);font-size:15px;flex-wrap:wrap}
.file .nm{flex:1;min-width:160px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.chk:hover{background:var(--sel)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;font-size:15px}
.tabs button[aria-selected="true"]{border-color:var(--accent);font-weight:700}
.help h3{margin:18px 0 4px;font-size:calc(var(--fs) + 1px)}
.help .card h3{margin-top:0}
.help p,.help li{font-size:calc(var(--fs) - 2px)}
.help ul{margin:4px 0 8px;padding-left:22px}
tr.qbad td{background:#fde2e2;color:#222}tr.qok td{background:#dff3e3;color:#222}
.empty{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);margin-top:16px}
mark{background:#ffe27a;color:#111;border-radius:3px;padding:0 2px}
/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,18,26,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;background:var(--surface);z-index:2}
.dlg .bd{padding:16px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
/* Datei-Dialog */
.fdlg{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:15px}
.fdlg .path{background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--line);font-family:ui-monospace,Consolas,monospace;font-size:13px}
.fdlg .it{display:flex;gap:10px;padding:8px 12px;cursor:pointer;align-items:center}
.fdlg .it:hover{background:var(--sel)}
.fdlg .it[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
/* Excel-Gitter */
.xl{border:1px solid var(--line);border-radius:6px;overflow:auto;background:#fff;color:#111;font:13px/1.35 Calibri,"Segoe UI",system-ui,sans-serif}
.xl table{border-collapse:collapse;min-width:100%}
.xl th{background:#e9ecef;color:#444;font-weight:400;border:1px solid #cfd4d9;padding:2px 8px;text-align:center;position:sticky;top:0}
.xl th.rn{position:static;width:34px}
.xl td{border:1px solid #dfe3e6;padding:3px 8px;white-space:nowrap}
.xl td.h{background:#0b7a75;color:#fff;font-weight:700}
.xl td.t{font-weight:700;font-size:15px}
.xl td.r{background:#fde2e2}
.xl td.gn{background:#dff3e3}
.xl td.g{background:#f2f4f5;color:#555}
.xl .sheets{display:flex;gap:2px;background:#e9ecef;padding:4px 6px;border-top:1px solid #cfd4d9;position:sticky;left:0}
.xl .sheets span{padding:3px 12px;border-radius:0 0 5px 5px;background:#d8dde1;color:#333;font-size:12px}
.xl .sheets span.a{background:#fff;font-weight:700;color:#0b7a75;box-shadow:inset 0 -2px #0b7a75}
/* PDF-Papier */
.paper{background:#fff;color:#111;max-width:560px;margin:0 auto;padding:34px 38px;box-shadow:0 4px 24px rgba(0,0,0,.25);border:1px solid #ccc;font-family:Georgia,"Times New Roman",serif}
.paper h4{font-size:22px;margin:0 0 2px;font-family:var(--font)}
.paper .m{color:#666;font-size:12px;margin-bottom:14px;font-family:var(--font)}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{background:#0b7a75;color:#fff;text-align:left;padding:6px 8px;font-family:var(--font);font-size:12px}
.paper td{padding:6px 8px;border-bottom:1px solid #ddd;vertical-align:top}
.paper .ft{margin-top:18px;font-size:10px;color:#888;text-align:center;font-family:var(--font)}
.dlbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg);margin-bottom:14px;font-size:14px}
.dlbar .p{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.dlbar .p i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.1s}
/* Installer */
.wiz{max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:0 10px 30px var(--shadow)}
.wiz .wt{background:var(--title);padding:7px 12px;font-size:13px;color:var(--muted)}
.wiz .wb{padding:22px 24px;min-height:250px}
.wiz .wb h3{font-size:20px}
.wiz .wf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}
.lic{height:120px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;background:var(--bg);margin:10px 0}
/* Lizenzen */
.lic-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.lic-grid .card h3{margin-bottom:8px}
.lic-grid ul{margin:0;padding-left:20px;font-size:15px}
.lic-grid li{margin-bottom:5px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:4px;vertical-align:1px}
.pill.g{background:var(--okbg);color:var(--ok)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:90;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
footer.pg{padding-block:30px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .side button{white-space:nowrap}
  .side .sp,.user{display:none}
  .page{padding:16px}
  .nav{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const L={de:{},en:{}};

add('brand','Vokabeltrainer Englisch B1','Vocabulary Trainer English B1');

add('hero_note','<b>Wichtig:</b> Diese Seite ist eine <b>Simulation</b>. Sie zeichnet die Oberfläche nach. Alle Beispiele sind frei erfunden, es sind keine Kursinhalte enthalten. Das echte Programm ist auf Deutsch, die englische Ansicht hier dient nur zur Erklärung.','<b>Please note:</b> This page is a <b>simulation</b>. It redraws the user interface. All examples are invented; no course material is included. The real program is in German; the English view here is for explanation only.');

let voices=[];function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}

function speak(text,l,done){
  if(!('speechSynthesis' in window)){toast(T('noaudio'));done&&done();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);const code=l=='de'?'de-DE':'en-US';u.lang=code;
  const v=voices.find(v=>v.lang==code)||voices.find(v=>v.lang.startsWith(l));if(v)u.voice=v;
  u.rate=Math.max(.5,Math.min(1.4,S.tempo));
  let fin=false;const end=()=>{if(!fin){fin=true;done&&done()}};
  u.onend=end;u.onerror=end;speechSynthesis.speak(u);
  setTimeout(end,Math.max(2500,text.length*130/Math.max(.5,S.tempo))+1500);
}
function stopSpeak(){S.run=false;S.playing=-1;try{speechSynthesis.cancel()}catch(e){}mark();}
